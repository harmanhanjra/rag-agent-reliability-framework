[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent-reliability-framework"
version = "1.0.0"
description = "Deterministic RAG and agent reliability evaluation framework using LlamaIndex and LangChain."
requires-python = ">=3.9"
dependencies = [
  "llama-index-core==0.10.68.post1",
  "langchain==0.2.17",
  "langchain-core==0.2.43",
  "pydantic==2.10.6",
  "scikit-learn==1.6.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
